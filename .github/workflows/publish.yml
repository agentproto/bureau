# Release workflow. It is a DRY RUN until a maintainer reviews and commits a
# change of PUBLISH_DRY_RUN to "false". There is deliberately no
# workflow_dispatch input that can switch the dry run off.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PUBLISH_DRY_RUN: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Dry-run publish (every publishable package)
        if: env.PUBLISH_DRY_RUN == 'true'
        run: pnpm -r publish --dry-run --no-git-checks --access public

      - name: Version PR or publish (changesets)
        if: env.PUBLISH_DRY_RUN != 'true'
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
